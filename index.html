<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>blog</title> 
        <style>
            header{
                background-color: #191a70;
                color: #f5f11d;
                text-align: center;
                max-width: 800px;
                margin: 0 auto;
                padding: 16px;
                 border: 5px solid
                 #0D2248;
            }
            main{
                color: #191a70;
                max-width: 800px;
                margin: 0 auto;
                padding: 16px;
                display: flex;
            }
            img{
                width: 80px;
                height: 80px;
            }
             .artigo-autor{

    <body>
        <header> 
        <h1>meu blog pokemon </h1>
        <p> vou compartilhar conhecimentos sobre pokemon</p>
        </header>

        <main>
            <img src="img.png" alt="imagem de um pikachu centralizado em pixels com uma pokebola ao lado">
            <div>
                <h2>meu primeiro post</h2>

                <p>bem vindo ao meu blog! vou compartilhar conhecimentos de pokemon.</p>
                   <button>🐲 <span>0</span></button>
                   <button>🐦‍🔥​ <span>0</span></button>
            </div>
       </main>
</body>
<script>
   const botao = document.querySelector("button");
   botao.addEventListener("click", botaoClicado);

   function botaoClicado(){
    console.log("fui criado");
    let texto = botao.querySelector("span");
    texto.textContent++;
   }


</script>
